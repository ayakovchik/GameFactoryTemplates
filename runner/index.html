<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Runner</title>
<style>
    body, html { margin:0; padding:0; overflow:hidden; background:#000; }
    canvas { display:block; margin:0 auto; background:url('__BG__') no-repeat center/cover; }
</style>
</head>
<body>
<canvas id="game" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const heroImg = new Image();
heroImg.src = "__HERO__";

const obstacles = [
    "__OBSTACLE_1__",
    "__OBSTACLE_2__",
    "__OBSTACLE_3__"
].map(src => {
    const img = new Image();
    img.src = src;
    return { img, x: 900 + Math.random()*400, y: 350, w:80, h:80 };
});

let hero = { x: 100, y: 350, w:80, h:80, vy:0, jumping:false };

let score = 0;
let scoreIcon = new Image();
scoreIcon.src = "__SCORE_ICON__";

document.addEventListener("keydown", e=>{
    if(e.code==="Space" && !hero.jumping){
        hero.vy = -12;
        hero.jumping = true;
    }
});

function update(){
    // gravity
    hero.y += hero.vy;
    hero.vy += 0.6;
    if(hero.y >= 350){
        hero.y = 350;
        hero.jumping = false;
    }

    // obstacles
    obstacles.forEach(o=>{
        o.x -= 6;
        if(o.x + o.w < 0){
            o.x = 800 + Math.random()*400;
            score++;
        }
        // collision
        if(hero.x < o.x+o.w && hero.x+hero.w > o.x && hero.y < o.y+o.h)
            score = 0;
    });
}

function draw(){
    ctx.clearRect(0,0,800,500);

    ctx.drawImage(heroImg, hero.x, hero.y, hero.w, hero.h);

    obstacles.forEach(o=>{
        ctx.drawImage(o.img, o.x, o.y, o.w, o.h);
    });

    ctx.drawImage(scoreIcon, 20, 20, 32, 32);
    ctx.fillStyle="white";
    ctx.font="24px Arial";
    ctx.fillText(score, 60, 45);

    update();
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
