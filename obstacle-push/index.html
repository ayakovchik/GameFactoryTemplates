<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Obstacle Push</title>
<style>
    body,html { margin:0; padding:0; background:#000; overflow:hidden; }
    canvas { display:block; margin:0 auto; background:url('__BG__') center/cover; }
</style>
</head>
<body>
<canvas id="game" width="800" height="500"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const heroImg=new Image(); heroImg.src="__HERO__";
const obstacleImg=new Image(); obstacleImg.src="__OBSTACLE_1__";
const scoreIcon=new Image(); scoreIcon.src="__SCORE_ICON__";

let hero={x:100,y:300,w:80,h:80};
let obstacle={x:400,y:300,w:120,h:120};

document.addEventListener("keydown",e=>{
    if(e.code==="ArrowRight") hero.x+=10;
    if(e.code==="ArrowLeft") hero.x-=10;
});

let score=0;

function update(){
    if(hero.x+hero.w > obstacle.x){
        obstacle.x+=8;
        score++;
    }

    if(obstacle.x>800){
        obstacle.x=400;
        score=0;
    }
}

function draw(){
    ctx.clearRect(0,0,800,500);

    ctx.drawImage(heroImg,hero.x,hero.y,hero.w,hero.h);
    ctx.drawImage(obstacleImg,obstacle.x,obstacle.y,obstacle.w,obstacle.h);

    ctx.drawImage(scoreIcon,20,20,32,32);
    ctx.fillStyle="white"; ctx.font="24px Arial";
    ctx.fillText(score,60,45);

    update();
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
