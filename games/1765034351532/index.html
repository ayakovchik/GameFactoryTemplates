<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Runner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
    }
    #game {
      display: block;
      margin: 0 auto;
      background: #111;
    }
    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    #score {
      font-size: 18px;
      text-shadow: 0 0 4px #000;
    }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="500"></canvas>
  <div id="hud">
    <div id="score">0</div>
  </div>

  <script>
    // ====== ПРОМПТЫ ДЛЯ ГЕНЕРАЦИИ АССЕТОВ ======
    const BG_PROMPT = "Улица города в стиле 80-х, с неоновыми вывесками и яркими огнями, основу составляет ночной пейзаж.";
    const HERO_PROMPT = "Изображение Майкла Джексона в культовой позе, выполняющего лунную походку, в ярком костюме 80-х, на улице города.";
    const OBSTACLE_PROMPTS = [
      "Эди Мерфи в комичном убегающем движении, в стильной одежде 80-х, на улице города.",
      "Переходный знак с изображением Майкла Джексона, делающего лунную походку, на ярком фоне.",
      "__OBSTACLE_3__"
    ];
    const SCORE_ICON_PROMPT = "Ретро значок с изображением музыкальной ноты, олицетворяющей поп-музыку 80-х.";
    // (сейчас игра использует статичные картинки, но эти строки
    // уже есть в собранном HTML и могут использоваться генератором картинок)

    // ====== ИГРОВАЯ ЛОГИКА ======
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const groundY = canvas.height - 80;

    const heroImg = new Image();
    heroImg.src = "img/hero.png";

    const obstacleImages = ["img/obstacle1.png", "img/obstacle2.png", "img/obstacle3.png"]
      .map(src => {
        const img = new Image();
        img.src = src;
        return img;
      });

    const scoreIcon = new Image();
    scoreIcon.src = "img/score_icon.png";

    let hero = {
      x: 80,
      y: groundY - 80,
      w: 60,
      h: 80,
      vy: 0,
      jumping: false
    };

    let obstacles = [];
    let score = 0;
    let speed = 6;
    let lastSpawn = 0;

    function spawnObstacle() {
      const img = obstacleImages[Math.floor(Math.random() * obstacleImages.length)];
      obstacles.push({
        x: canvas.width + 20,
        y: groundY - 70,
        w: 60,
        h: 70,
        img
      });
    }

    function resetGame() {
      hero.y = groundY - hero.h;
      hero.vy = 0;
      hero.jumping = false;
      obstacles = [];
      score = 0;
      speed = 6;
      lastSpawn = 0;
    }

    function update(dt) {
      // гравитация
      hero.vy += 0.8;
      hero.y += hero.vy;

      if (hero.y >= groundY - hero.h) {
        hero.y = groundY - hero.h;
        hero.vy = 0;
        hero.jumping = false;
      }

      // движение препятствий
      obstacles.forEach(o => o.x -= speed);
      obstacles = obstacles.filter(o => o.x + o.w > -100);

      // спавн препятствий
      lastSpawn += dt;
      if (lastSpawn > 1300) {
        spawnObstacle();
        lastSpawn = 0;
        speed += 0.1;
      }

      // столкновения
      for (const o of obstacles) {
        if (
          hero.x < o.x + o.w &&
          hero.x + hero.w > o.x &&
          hero.y < o.y + o.h &&
          hero.y + hero.h > o.y
        ) {
          resetGame();
          break;
        }
      }

      score += dt * 0.005;
    }

    function draw() {
      ctx.fillStyle = "#151515";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // земля
      ctx.fillStyle = "#242424";
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      // герой
      if (heroImg.complete) {
        ctx.drawImage(heroImg, hero.x, hero.y, hero.w, hero.h);
      } else {
        ctx.fillStyle = "#4caf50";
        ctx.fillRect(hero.x, hero.y, hero.w, hero.h);
      }

      // препятствия
      for (const o of obstacles) {
        if (o.img.complete) {
          ctx.drawImage(o.img, o.x, o.y, o.w, o.h);
        } else {
          ctx.fillStyle = "#f44336";
          ctx.fillRect(o.x, o.y, o.w, o.h);
        }
      }

      // HUD
      if (scoreIcon.complete) {
        ctx.drawImage(scoreIcon, 10, 10, 24, 24);
      }
      ctx.fillStyle = "#fff";
      ctx.font = "18px system-ui";
      ctx.fillText(Math.floor(score), 40, 30);
    }

    let lastTime = performance.now();
    function loop(t) {
      const dt = t - lastTime;
      lastTime = t;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // управление
    window.addEventListener("keydown", e => {
      if ((e.code === "Space" || e.code === "ArrowUp") && !hero.jumping) {
        hero.vy = -15;
        hero.jumping = true;
      }
    });

    canvas.addEventListener("touchstart", () => {
      if (!hero.jumping) {
        hero.vy = -15;
        hero.jumping = true;
      }
    });

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
