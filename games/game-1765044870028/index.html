<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Runner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #222;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
    }
    #wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #222;
    }
    #game {
      background: #87ceeb; /* яркое небо, чтобы точно было видно */
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,.4);
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      font-size: 18px;
      text-shadow: 0 0 4px #000;
    }
    #hint {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 14px;
      opacity: .8;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <!-- 9:16 под телефон -->
    <canvas id="game" width="360" height="640"></canvas>
  </div>

  <div id="hud">
    <div id="score">0</div>
  </div>
  <div id="hint">Нажми или ткни по экрану, чтобы прыгнуть</div>

  <script>
    // ====== ПРОМПТЫ ДЛЯ ГЕНЕРАЦИИ АССЕТОВ ======
    const BG_PROMPT =
      "A vibrant park setting with a race track, sunny sky, and cheering fans.";
    const HERO_PROMPT =
      "A lively Michael Jackson in his iconic outfit, performing a dance move with enthusiasm, ready for a race.";
    const OBSTACLE_PROMPTS = [
      "Eddie Murphy dressed in running gear, sprinting with a playful smile.",
      "A puddle of sparkling glitter on the racetrack.",
      "__OBSTACLE_3__"
    ];
    const SCORE_ICON_PROMPT =
      "A fun icon of a music note combined with a sneaker, symbolizing scores for dancing and running.";

    // ====== ИГРОВАЯ ЛОГИКА ======
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const groundY = canvas.height - 80;

    const heroImg = new Image();
    heroImg.src = "img/hero.png";

    const obstacleImages = ["img/obstacle1.png", "img/obstacle2.png", "img/obstacle3.png"]
      .map(src => {
        const img = new Image();
        img.src = src;
        return img;
      });

    const scoreIcon = new Image();
    scoreIcon.src = "img/score_icon.png";

    let hero = {
      x: 60,
      y: groundY - 80,
      w: 60,
      h: 80,
      vy: 0,
      jumping: false
    };

    let obstacles = [];
    let score = 0;
    let speed = 4;
    let lastSpawn = 0;

    function spawnObstacle() {
      const img = obstacleImages[Math.floor(Math.random() * obstacleImages.length)];
      obstacles.push({
        x: canvas.width + 40,
        y: groundY - 70,
        w: 60,
        h: 70,
        img
      });
    }

    function resetGame() {
      hero.y = groundY - hero.h;
      hero.vy = 0;
      hero.jumping = false;
      obstacles = [];
      score = 0;
      speed = 4;
      lastSpawn = 0;
    }

    function update(dt) {
      // гравитация
      hero.vy += 0.8;
      hero.y += hero.vy;

      if (hero.y >= groundY - hero.h) {
        hero.y = groundY - hero.h;
        hero.vy = 0;
        hero.jumping = false;
      }

      // движение препятствий
      obstacles.forEach(o => o.x -= speed);
      obstacles = obstacles.filter(o => o.x + o.w > -100);

      // спавн препятствий
      lastSpawn += dt;
      if (lastSpawn > 1300) {
        spawnObstacle();
        lastSpawn = 0;
        speed += 0.05;
      }

      // столкновения
      for (const o of obstacles) {
        if (
          hero.x < o.x + o.w &&
          hero.x + hero.w > o.x &&
          hero.y < o.y + o.h &&
          hero.y + hero.h > o.y
        ) {
          resetGame();
          break;
        }
      }

      score += dt * 0.005;
    }

    function draw() {
      // фон: небо
      const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGradient.addColorStop(0, "#87ceeb");
      skyGradient.addColorStop(1, "#4fa3d1");
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // земля
      ctx.fillStyle = "#3c9f40";
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      // герой
      if (heroImg.complete && heroImg.naturalWidth) {
        ctx.drawImage(heroImg, hero.x, hero.y, hero.w, hero.h);
      } else {
        ctx.fillStyle = "#ffeb3b";
        ctx.fillRect(hero.x, hero.y, hero.w, hero.h);
      }

      // препятствия
      for (const o of obstacles) {
        if (o.img.complete && o.img.naturalWidth) {
          ctx.drawImage(o.img, o.x, o.y, o.w, o.h);
        } else {
          ctx.fillStyle = "#f44336";
          ctx.fillRect(o.x, o.y, o.w, o.h);
        }
      }

      // HUD
      if (scoreIcon.complete && scoreIcon.naturalWidth) {
        ctx.drawImage(scoreIcon, 10, 10, 24, 24);
      }
      ctx.fillStyle = "#fff";
      ctx.font = "18px system-ui";
      ctx.fillText(Math.floor(score), 40, 30);
    }

    let lastTime = performance.now();
    function loop(t) {
      const dt = t - lastTime;
      lastTime = t;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function jump() {
      if (!hero.jumping) {
        hero.vy = -16;
        hero.jumping = true;
      }
    }

    // управление
    window.addEventListener("keydown", e => {
      if (e.code === "Space" || e.code === "ArrowUp") {
        jump();
      }
    });

    canvas.addEventListener("touchstart", () => {
      jump();
    });

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
