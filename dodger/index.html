<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Dodger</title>
<style>
    body,html { margin:0; padding:0; overflow:hidden; background:#000; }
    canvas { display:block; margin:0 auto; background:url('__BG__') center/cover; }
</style>
</head>
<body>
<canvas id="game" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const heroImg = new Image();
heroImg.src = "__HERO__";

let hero = { x:400, y:250, w:70, h:70, speed:6 };

const keys = {};
document.addEventListener("keydown", e=>keys[e.code]=true);
document.addEventListener("keyup", e=>keys[e.code]=false);

const obstacleImgs = ["__OBSTACLE_1__", "__OBSTACLE_2__", "__OBSTACLE_3__"].map(s=>{
    const i=new Image(); i.src=s; return i;
});

let obstacles = [];

function spawnObstacle(){
    const img = obstacleImgs[Math.floor(Math.random()*obstacleImgs.length)];
    obstacles.push({
        img,
        x: Math.random()>0.5 ? -50 : 850,
        y: Math.random()*450,
        w:70,
        h:70,
        vx: (Math.random()*4+2)*(Math.random()>0.5?1:-1),
        vy: (Math.random()*4+2)*(Math.random()>0.5?1:-1)
    });
}

setInterval(spawnObstacle, 800);

let score = 0;
let scoreIcon = new Image();
scoreIcon.src = "__SCORE_ICON__";

function update(){
    if(keys["ArrowUp"]) hero.y -= hero.speed;
    if(keys["ArrowDown"]) hero.y += hero.speed;
    if(keys["ArrowLeft"]) hero.x -= hero.speed;
    if(keys["ArrowRight"]) hero.x += hero.speed;

    hero.x = Math.max(0, Math.min(800-hero.w, hero.x));
    hero.y = Math.max(0, Math.min(500-hero.h, hero.y));

    obstacles.forEach(o=>{
        o.x += o.vx;
        o.y += o.vy;

        if(o.x<-100||o.x>900||o.y<-100||o.y>600){
            o.x = 400;
            o.y = 250;
            score++;
        }

        if(hero.x<o.x+o.w && hero.x+hero.w>o.x && hero.y<o.y+o.h){
            score = 0;
        }
    });
}

function draw(){
    ctx.clearRect(0,0,800,500);

    ctx.drawImage(heroImg, hero.x, hero.y, hero.w, hero.h);

    obstacles.forEach(o=>{
        ctx.drawImage(o.img, o.x, o.y, o.w, o.h);
    });

    ctx.drawImage(scoreIcon,20,20,32,32);
    ctx.fillStyle="white";
    ctx.font="24px Arial";
    ctx.fillText(score,60,45);

    update();
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
