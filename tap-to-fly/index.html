<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Jumper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #fff;
    }
    #game {
      display: block;
      margin: 0 auto;
      background: #111;
    }
    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    #score {
      font-size: 18px;
      text-shadow: 0 0 4px #000;
    }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="500"></canvas>
  <div id="hud">
    <div id="score">0</div>
  </div>

  <script>
    // ====== ПРОМПТЫ ДЛЯ ГЕНЕРАЦИИ АССЕТОВ ======
    const BG_PROMPT = "__BG__";
    const HERO_PROMPT = "__HERO__";
    const OBSTACLE_PROMPTS = [
      "__OBSTACLE_1__",
      "__OBSTACLE_2__",
      "__OBSTACLE_3__"
    ];
    const SCORE_ICON_PROMPT = "__SCORE_ICON__";

    // ====== JUMPER: ПЛАТФОРМЕР С ВВЕРХНИМ СКРОЛЛОМ ======
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const heroImg = new Image();
    heroImg.src = "img/hero.png";

    const platformImg = new Image();
    platformImg.src = "img/obstacle1.png";

    const scoreIcon = new Image();
    scoreIcon.src = "img/score_icon.png";

    const GRAVITY = 0.5;
    const JUMP_FORCE = -12;

    let hero = {
      x: canvas.width / 2 - 30,
      y: canvas.height - 100,
      w: 60,
      h: 60,
      vy: 0,
      onGround: false,
    };

    let platforms = [];
    let score = 0;
    let scrollOffset = 0;

    function createInitialPlatforms() {
      platforms = [];
      const step = 70;
      for (let i = 0; i < 10; i++) {
        platforms.push({
          x: Math.random() * (canvas.width - 120),
          y: canvas.height - i * step,
          w: 120,
          h: 20,
        });
      }
    }

    function addPlatform(y) {
      platforms.push({
        x: Math.random() * (canvas.width - 120),
        y,
        w: 120,
        h: 20,
      });
    }

    function resetGame() {
      hero.x = canvas.width / 2 - hero.w / 2;
      hero.y = canvas.height - 100;
      hero.vy = 0;
      hero.onGround = false;
      score = 0;
      scrollOffset = 0;
      createInitialPlatforms();
    }

    function update(dt) {
      // физика героя
      hero.vy += GRAVITY;
      hero.y += hero.vy;

      // если герой падает вниз - конец
      if (hero.y - scrollOffset > canvas.height + 100) {
        resetGame();
        return;
      }

      // столкновения с платформами (только если падаем вниз)
      hero.onGround = false;
      for (const p of platforms) {
        const prevY = hero.y - hero.vy;
        const isFalling = hero.vy > 0;
        const withinX = hero.x + hero.w > p.x && hero.x < p.x + p.w;
        const crossedY = prevY + hero.h <= p.y && hero.y + hero.h >= p.y;

        if (isFalling && withinX && crossedY) {
          hero.y = p.y - hero.h;
          hero.vy = JUMP_FORCE;
          hero.onGround = true;
          score += 1;
        }
      }

      // вертикальный скролл – герой остаётся примерно в середине
      const threshold = canvas.height * 0.4;
      if (hero.y < threshold) {
        const diff = threshold - hero.y;
        hero.y += diff;
        scrollOffset += diff;
        platforms.forEach(p => p.y += diff);
      }

      // убираем платформы, что ушли вниз, и добавляем новые сверху
      const minY = Math.min(...platforms.map(p => p.y));
      platforms = platforms.filter(p => p.y < canvas.height + 50);
      while (platforms.length < 12) {
        addPlatform(minY - Math.random() * 60 - 40);
      }
    }

    function draw() {
      ctx.fillStyle = "#151515";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // платформы
      for (const p of platforms) {
        if (platformImg.complete) {
          ctx.drawImage(platformImg, p.x, p.y, p.w, p.h);
        } else {
          ctx.fillStyle = "#607d8b";
          ctx.fillRect(p.x, p.y, p.w, p.h);
        }
      }

      // герой
      if (heroImg.complete) {
        ctx.drawImage(heroImg, hero.x, hero.y, hero.w, hero.h);
      } else {
        ctx.fillStyle = "#ff9800";
        ctx.fillRect(hero.x, hero.y, hero.w, hero.h);
      }

      // HUD
      if (scoreIcon.complete) {
        ctx.drawImage(scoreIcon, 10, 10, 24, 24);
      }
      ctx.fillStyle = "#fff";
      ctx.font = "18px system-ui";
      ctx.fillText(score, 40, 30);
    }

    let lastTime = performance.now();
    function loop(t) {
      const dt = t - lastTime;
      lastTime = t;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // управление
    const keys = { left: false, right: false };

    window.addEventListener("keydown", e => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
    });

    window.addEventListener("keyup", e => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
    });

    canvas.addEventListener("touchstart", e => {
      const x = e.touches[0].clientX - canvas.getBoundingClientRect().left;
      keys.left = x < canvas.width / 2;
      keys.right = !keys.left;
    });

    canvas.addEventListener("touchend", () => {
      keys.left = keys.right = false;
    });

    function applyHorizontalMove() {
      const speed = 6;
      if (keys.left) hero.x -= speed;
      if (keys.right) hero.x += speed;
      if (hero.x < 0) hero.x = 0;
      if (hero.x + hero.w > canvas.width) hero.x = canvas.width - hero.w;
    }

    // маленький хак – двигаем по X в каждом кадре
    (function patchLoop() {
      const origLoop = loop;
      function wrapped(t) {
        applyHorizontalMove();
        origLoop(t);
      }
      requestAnimationFrame(function start(t) {
        lastTime = t;
        requestAnimationFrame(wrapped);
      });
    })();

    resetGame();
  </script>
</body>
</html>
